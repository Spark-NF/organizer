site_name: Organizer
site_url: https://spark-nf.github.io/organizer
repo_url: https://github.com/Spark-NF/organizer
repo_name: Spark-NF/organizer
edit_uri: edit/main/docs/
copyright: This project is maintained by <a href="https://github.com/Spark-NF" data-label="Owner">Spark-NF</a>
use_directory_urls: false

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized

theme:
  name: material
  language: en
  logo: assets/img/icon.png
  favicon: assets/favicon.ico

  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tooltips

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  custom_dir: docs/theme
  subtitle: Organize your files
  description: Organizer applies rules to your files and is free, open source, and cross-platform.

extra_css:
  - assets/css/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Spark-NF
      name: GitHub

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - github-callouts
  - toc:
      permalink: '¶'
