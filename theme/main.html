{% extends "base.html" %}

{% block scripts %}
    {{ super() }}

    <script>
        document$.subscribe(function() {
            document.querySelectorAll(".md-tabs__link").forEach(function(link) {
                if (link.hostname !== window.location.hostname) {
                    link.setAttribute("target", "_blank");
                    link.setAttribute("rel", "noopener");
                }
            });
        });
    </script>
{% endblock %}
